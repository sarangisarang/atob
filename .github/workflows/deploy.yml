name: Deploy to production

# Manual trigger only (click "Run workflow" in the Actions tab).
# This keeps production deploys deliberate — flip to `push` below once you
# trust the pipeline:
#
#   on:
#     push:
#       branches: [main]
#
on:
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Sync & restart on VPS
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      # Push code to the server. No --delete, and we exclude server-managed
      # files so we never touch the prod secrets, DB backups, or live TLS certs.
      - name: Sync code to VPS
        run: |
          rsync -az \
            --exclude='.env' \
            --exclude='backups/' \
            --exclude='nginx/certbot/' \
            -e "ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=accept-new" \
            backend deploy \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/opt/atob-transport/"

      # Safety gate: never rebuild the backend if the server is missing its
      # secrets file — a blank env starts a backend that can't reach the DB
      # and takes prod down. Fail loudly *before* touching any container.
      - name: Pre-flight — verify prod .env
        run: |
          ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=accept-new \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            'test -s /opt/atob-transport/deploy/.env && grep -q "^DB_PASSWORD=." /opt/atob-transport/deploy/.env' \
          || { echo "::error::Prod .env is missing or has no DB_PASSWORD — aborting before restart"; exit 1; }

      - name: Build & restart backend
        run: |
          ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=accept-new \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            'cd /opt/atob-transport/deploy && docker compose -f docker-compose.prod.yml up -d --build backend'

      # The backend has no public health endpoint — Spring Security answers
      # everything with 401 when it's up. So 200/401/403 = app is serving;
      # 000/502/503/504 = backend is down or nginx can't reach it.
      - name: Health check
        run: |
          sleep 15
          for i in $(seq 1 10); do
            code=$(curl -s -o /dev/null -w '%{http_code}' https://api.atobtransport.de/api/transport-types || echo 000)
            echo "attempt $i → HTTP $code"
            case "$code" in
              200|401|403) echo "Backend is up ✅"; exit 0 ;;
            esac
            sleep 6
          done
          echo "Backend not responding (gateway error) — check the server."
          exit 1
