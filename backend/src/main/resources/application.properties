spring.datasource.url=jdbc:postgresql://localhost:5433/atobapp
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=atob
spring.datasource.password=atob123

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Flyway manages the schema — Hibernate only validates
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration,classpath:db/dev

# Never let Spring Boot run data.sql — Flyway is the only schema/data manager
spring.sql.init.mode=never

spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=15MB
